<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Роды</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<link rel="stylesheet" href="style.css?v=11">
<script>try{const t=localStorage.getItem("theme");if(t)document.documentElement.dataset.theme=t}catch{}</script>
</head>
<body>
<header id="bar">
  <a id="home" href="#/" title="Главный холст">Роды</a>
  <select id="pick" aria-label="Холст"></select>
  <span id="cvctl">
    <button id="fit" title="Вписать в экран">⤢</button>
    <button id="zin" title="Приблизить">+</button>
    <button id="zout" title="Отдалить">−</button>
    <span id="zoom">100%</span>
  </span>
  <button id="theme" title="Светлая / тёмная тема">◐</button>
</header>
<main id="host">
</main>
<nav id="modes" hidden></nav>
<div id="axes" hidden>
  <span class="ax top">↑ высокий статус и репутация</span>
  <span class="ax bottom">низкий статус и репутация ↓</span>
  <span class="ax left">← радикалы чистокровности</span>
  <span class="ax right">противоположный фланг →</span>
</div>
<details id="legend" hidden></details>

<div id="page" hidden></div>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script src="viewer.js?v=11"></script>
</body>
</html>
